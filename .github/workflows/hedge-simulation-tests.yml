name: Hedge and simulation regression checks
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'apps/simulator/**'
      - 'apps/term-structure/**'
      - 'apps/combo-pnl/**'
      - '.github/workflows/hedge-simulation-tests.yml'
  workflow_dispatch:
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test lib/delta-hedging/*.test.js lib/market-model/*.test.js lib/minute-history.test.js
  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [simulator, term-structure, combo-pnl]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
